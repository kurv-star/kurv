<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kurv">
<meta name="theme-color" content="#fbfaf7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Kurv</title>
<link rel="stylesheet" href="app.css?v=__BUILD__">
</head>
<body>

<header>
  <div class="hrow">
    <h1>Kurv</h1>
    <button id="gear" class="gear" data-act="gear" aria-label="Plan and settings">⚙</button>
  </div>
  <div id="snapshot" class="snapshot"><span class="dot"></span>Loading…</div>
  <div class="buildtag">build __BUILD__</div>
</header>

<main>
  <section class="panel" id="panel-today"><div id="todayBody"></div></section>
  <section class="panel" id="panel-stock"><div id="stockBody"></div></section>
  <section class="panel" id="panel-money"><div id="moneyBody"></div></section>
  <section class="panel" id="panel-plan">
    <div id="planBody"></div>
    <input type="file" id="importFile" accept="application/json" hidden>
  </section>
</main>

<nav>
  <button data-tab="today"><span class="g">◎</span>Buy</button>
  <button data-tab="stock"><span class="g">▤</span>Stock</button>
  <button data-tab="money"><span class="g">◺</span>Money</button>
</nav>

<div class="modal" id="searchModal">
  <div class="sheet">
    <div class="sheethead">
      <h3>Watch for <span id="searchFor"></span></h3>
      <button class="btn sm ghost" data-act="closesheet">Done</button>
    </div>
    <input id="q" placeholder="eggs, æg, malk, pasta…" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="storefilter" id="stores"></div>
    <div id="results"></div>
  </div>
</div>

<div class="modal" id="buyModal">
  <div class="sheet">
    <div class="sheethead"><div><h3 id="buyTitle"></h3><div class="muted" id="buySub"></div></div></div>
    <div class="f2" style="margin-top:12px">
      <div class="field"><label>When</label><input id="buyDate" type="date"></div>
      <div class="field"><label>Packs</label><input id="buyPacks" type="number" min="1" step="1" value="1"></div>
    </div>
    <div class="field">
      <label id="buyUnitsLabel"></label>
      <input id="buyUnits" type="number" step="any" min="0">
      <div class="hint" id="buyUnitsHint"></div>
    </div>
    <div class="field">
      <label>Keeps for</label>
      <div id="buyKeep"></div>
      <div class="customdays" hidden><input class="customdays-input" id="buyKeepCustom" type="number" min="1" placeholder="days"></div>
    </div>
    <div id="buyPreview"></div>
    <div class="btn-row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn ghost" data-act="closesheet">Cancel</button>
      <button class="btn" data-act="confirmbuy">Log it</button>
    </div>
  </div>
</div>

<div class="modal" id="stockModal">
  <div class="sheet">
    <div class="sheethead"><h3 id="stTitle"></h3></div>
    <div class="f2" style="margin-top:12px">
      <div class="field"><label id="stUnitsLabel"></label><input id="stUnits" type="number" step="any" min="0"></div>
      <div class="field"><label>Since</label><input id="stDate" type="date"></div>
    </div>
    <div class="field">
      <label>Keeps for</label>
      <div id="stKeep"></div>
      <div class="customdays" hidden><input class="customdays-input" id="stKeepCustom" type="number" min="1" placeholder="days"></div>
    </div>
    <div class="btn-row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn ghost" data-act="closesheet">Cancel</button>
      <button class="btn" data-act="confirmstock">Add</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=__BUILD__"></script>
<script src="view.js?v=__BUILD__"></script>
</body>
</html>
