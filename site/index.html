<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kurv">
<meta name="theme-color" content="#fbfaf7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Kurv</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="hrow">
    <h1>Kurv</h1>
    <button id="gear" class="gear" data-act="gear" aria-label="Settings">⚙</button>
  </div>
  <div id="snapshot" class="snapshot"><span class="dot"></span>Loading…</div>
</header>

<main>
  <section class="panel" id="panel-today"><div id="todayBody"></div></section>
  <section class="panel" id="panel-stock"><div id="stockBody"></div></section>
  <section class="panel" id="panel-money"><div id="moneyBody"></div></section>
  <section class="panel" id="panel-setup">
    <div id="setupBody"></div>
    <input type="file" id="importFile" accept="application/json" hidden>
  </section>
</main>

<nav>
  <button data-tab="today"><span class="g">◎</span>Today</button>
  <button data-tab="stock"><span class="g">▤</span>Stock</button>
  <button data-tab="money"><span class="g">◺</span>Money</button>
</nav>

<div class="modal" id="searchModal">
  <div class="sheet">
    <div class="sheethead">
      <div><h3>Add to <span id="searchFor"></span></h3></div>
      <button class="btn sm ghost" data-act="closesheet">Done</button>
    </div>
    <input id="q" placeholder="pasta, malk, aeg…" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="storefilter" id="stores"></div>
    <div id="results" style="margin-top:10px"></div>
  </div>
</div>

<div class="modal" id="buyModal">
  <div class="sheet">
    <div class="sheethead">
      <div><h3 id="buyTitle">Item</h3><div class="muted" id="buySub"></div></div>
    </div>

    <div class="f2" style="margin-top:12px">
      <div class="field"><label>When</label><input id="buyDate" type="date"></div>
      <div class="field"><label>How many packs</label><input id="buyPacks" type="number" min="1" step="1" value="1"></div>
    </div>
    <div class="field">
      <label id="buyUnitsLabel">Units in one pack</label>
      <input id="buyUnits" type="number" step="any" min="0">
      <div class="hint" id="buyUnitsHint"></div>
    </div>

    <details class="disc"><summary>This pack keeps longer or shorter than usual</summary>
      <div class="dbody"><div class="f2">
        <div class="field"><label>Unopened</label><input id="buyShelf" type="number" min="1" placeholder="list default"><div class="hint">days</div></div>
        <div class="field"><label>Once opened</label><input id="buyOpened" type="number" min="1" placeholder="list default"><div class="hint">days</div></div>
      </div></div>
    </details>

    <div id="buyPreview"></div>

    <div class="btn-row" style="margin-top:14px;justify-content:flex-end">
      <button class="btn ghost" data-act="closesheet">Cancel</button>
      <button class="btn" data-act="confirmbuy">Log it</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script src="view.js"></script>
</body>
</html>
